const statusOrder = {"✅真实匹配":0,"⚠️假阳性":1,"🟡部分匹配":2,"❌无匹配":3};
const statusClass = {"✅真实匹配":"ok","⚠️假阳性":"fp","🟡部分匹配":"partial","❌无匹配":"fail"};

let currentFilter = "";
let currentNode = "";
let sortCol = "status";
let sortAsc = true;

function renderStats() {
  const counts = {};
  DATA.forEach(r => { counts[r.status] = (counts[r.status]||0)+1; });
  const items = [
    {key:"✅真实匹配",cls:"ok",label:"真实匹配"},
    {key:"⚠️假阳性",cls:"fp",label:"假阳性"},
    {key:"🟡部分匹配",cls:"partial",label:"部分匹配"},
    {key:"❌无匹配",cls:"fail",label:"无匹配"},
  ];
  const el = document.getElementById("stats");
  el.innerHTML = items.map(it => {
    const n = counts[it.key]||0;
    const active = currentFilter === it.key ? "active" : "";
    return `<div class="stat ${it.cls} ${active}" onclick="toggleFilter('${it.key}')">
      <div class="num">${n}</div><div class="label">${it.label} (${(100*n/DATA.length).toFixed(1)}%)</div></div>`;
  }).join("");
}

function toggleFilter(status) {
  currentFilter = currentFilter === status ? "" : status;
  document.getElementById("filter").value = "";
  render();
}

function getFiltered() {
  let d = DATA;
  if (currentFilter) d = d.filter(r => r.status === currentFilter);
  if (currentNode) d = d.filter(r => r.nodes.includes(currentNode));
  const q = document.getElementById("filter").value.toLowerCase().trim();
  if (q) {
    d = d.filter(r => {
      return r.phrase.toLowerCase().includes(q)
        || r.match_name.toLowerCase().includes(q)
        || r.metric_id.toLowerCase().includes(q)
        || r.nodes.join(",").includes(q)
        || r.tokens.join(" ").includes(q)
        || r.detail.toLowerCase().includes(q);
    });
  }
  return d;
}

function sortData(data) {
  return data.sort((a,b) => {
    let va, vb;
    if (sortCol === "status") { va = statusOrder[a.status]; vb = statusOrder[b.status]; }
    else { va = a[sortCol] || ""; vb = b[sortCol] || ""; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
}

function render() {
  renderStats();
  let d = sortData(getFiltered());
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = d.map(r => {
    const cls = statusClass[r.status];
    const charts = r.charts.map(c => `${c[0]}·C${c[1]}: ${c[2]}`).join("<br>");
    return `<tr>
      <td><span class="badge ${cls}">${r.status}</span></td>
      <td class="phrase">${r.phrase}</td>
      <td class="tokens">${r.tokens.join(" ")}</td>
      <td class="metric-id">${r.metric_id||"—"}</td>
      <td class="match-name">${r.match_name||"—"}</td>
      <td class="nodes">${r.nodes.join(", ")}</td>
      <td class="chart-info">${charts}</td>
    </tr>`;
  }).join("");
  document.getElementById("info").textContent =
    `显示 ${d.length} / ${DATA.length} 条 · 同花顺概念→知几注册映射`;
}

// Init node filter dropdown
const allNodes = new Set();
DATA.forEach(r => r.nodes.forEach(n => allNodes.add(n)));
const nf = document.getElementById("nodeFilter");
[...allNodes].sort((a,b) => {
  const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++) { if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)-(pb[i]||0); }
  return 0;
}).forEach(n => { const o = document.createElement("option"); o.value=n; o.textContent=n; nf.appendChild(o); });

document.getElementById("filter").addEventListener("input", () => { currentFilter=""; render(); });
document.getElementById("nodeFilter").addEventListener("change", e => { currentNode = e.target.value; render(); });

document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.dataset.col;
    if (sortCol === col) sortAsc = !sortAsc;
    else { sortCol = col; sortAsc = true; }
    render();
  });
});

render();
</script>
