const statusClass = {
  "✅真实匹配": "ok",
  "⚠️假阳性": "fp",
  "🟡部分匹配": "partial",
  "❌无匹配": "fail",
  "❓未检索": "unknown"
};

function render() {
  const nodeFilter = document.getElementById("nodeFilter").value;
  const matchFilter = document.getElementById("matchFilter").value;
  const searchFilter = document.getElementById("searchFilter").value.toLowerCase();
  
  let filtered = DATA;
  
  if (nodeFilter) {
    filtered = filtered.filter(r => r.node === nodeFilter);
  }
  
  if (matchFilter) {
    filtered = filtered.filter(r => r.match_results.some(m => m.status === matchFilter));
  }
  
  if (searchFilter) {
    filtered = filtered.filter(r => {
      const text = [
        r.chart_name,
        r.indicators_raw,
        r.match_results.map(m => m.phrase).join(" "),
        r.match_results.map(m => m.metric_id).join(" "),
        r.presentation,
        r.obs_use
      ].join(" ").toLowerCase();
      return text.includes(searchFilter);
    });
  }
  
  // Group by node
  const byNode = {};
  filtered.forEach(r => {
    if (!byNode[r.node]) byNode[r.node] = [];
    byNode[r.node].push(r);
  });
  
  const content = document.getElementById("content");
  const nodes = Object.keys(byNode).sort((a,b) => {
    const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
    }
    return 0;
  });
  
  content.innerHTML = nodes.map(node => {
    const records = byNode[node];
    const firstRecord = records[0];
    const chartCount = records.length;
    const indicatorCount = records.reduce((sum, r) => sum + r.match_results.length, 0);
    
    return `
      <div class="node-section">
        <div class="node-header">
          <div class="node-title">${firstRecord.node_title}</div>
          <div class="node-subtitle">${chartCount}个图表 · ${indicatorCount}个指标引用</div>
        </div>
        <div class="chart-grid">
          ${records.map(r => `
            <div class="chart-card">
              <div class="chart-title">${r.chart_num}. ${r.chart_name}</div>
              <div class="chart-presentation">${r.presentation}</div>
              <ul class="indicator-list">
                ${r.match_results.map(m => `
                  <li class="indicator-item">
                    <div class="indicator-name">
                      ${m.phrase}
                      <span class="badge ${statusClass[m.status]}">${m.status}</span>
                    </div>
                    ${m.metric_id ? `
                      <div class="indicator-match">
                        <span class="metric-id">${m.metric_id}</span> · 
                        <span class="match-name">${m.match_name}</span>
                      </div>
                    ` : ''}
                  </li>
                `).join('')}
              </ul>
              <div class="obs-use">💡 ${r.obs_use}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById("info").textContent = 
    `显示 ${filtered.length} / ${DATA.length} 条图表记录`;
}

// Init node filter
const allNodes = [...new Set(DATA.map(r => r.node))].sort((a,b) => {
  const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    if ((pa[i]||0) !== (pb[i]||0)) return (pa[i]||0) - (pb[i]||0);
  }
  return 0;
});

const nf = document.getElementById("nodeFilter");
allNodes.forEach(n => {
  const o = document.createElement("option");
  o.value = n;
  o.textContent = n;
  nf.appendChild(o);
});

document.getElementById("nodeFilter").addEventListener("change", render);
document.getElementById("matchFilter").addEventListener("change", render);
document.getElementById("searchFilter").addEventListener("input", render);

render();
</script>
