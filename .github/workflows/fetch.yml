name: Fetch Nickel Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # === [0] Setup Python environment ===
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Set environment variables
        run: |
          echo "ZHJI_KEY=${{ secrets.ZHJI_KEY }}" >> $GITHUB_ENV
          echo "GUAN_KEY=${{ secrets.GUAN_KEY }}" >> $GITHUB_ENV
          echo "NEWS_KEY=${{ secrets.NEWS_KEY }}" >> $GITHUB_ENV
          echo "DATA_KEY=${{ secrets.DATA_KEY }}" >> $GITHUB_ENV
          echo "ZSUN_KEY=${{ secrets.ZSUN_KEY }}" >> $GITHUB_ENV
          echo "DASHSCOPE_KEY=${{ secrets.DASHSCOPE_KEY }}" >> $GITHUB_ENV
          echo "DASHSCOPE_MODEL=${{ secrets.DASHSCOPE_MODEL }}" >> $GITHUB_ENV

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          ZHJI_KEY: ${{ secrets.ZHJI_KEY }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
          DASHSCOPE_KEY: ${{ secrets.DASHSCOPE_KEY }}
        run: python fetch_data.py

      - name: Commit & push data.json
        run: |
          git config user.name "ni-bot"
          git config user.email "ni-bot@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data $(date +%Y-%m-%d\ %H:%M)"
          git push
