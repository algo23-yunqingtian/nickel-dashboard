name: Fetch Nickel Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          ZHJI_KEY: ${{ secrets.ZHJI_KEY }}
          SILICONFLOW_KEY: ${{ secrets.SILICONFLOW_KEY }}
        run: python fetch_data.py

      - name: Commit & push data.json
        run: |
          git config user.name "ni-bot"
          git config user.email "ni-bot@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data $(date +%Y-%m-%d\ %H:%M)"
          git push
